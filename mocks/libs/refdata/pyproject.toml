[project]
name = "loandesk-refdata"
version = "0.1.0"
description = "Synthetic reference data for the LoanDesk mock systems: instruments, identifiers, counterparties, market."
requires-python = ">=3.13"
dependencies = ["loandesk-mockcore"]

[project.scripts]
refdata = "refdata.cli:main"

[tool.uv.sources]
loandesk-mockcore = { path = "../mockcore" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refdata"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["refdata"]
