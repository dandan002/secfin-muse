# The five-minute demo's market side (spec: "Five-minute demo script").
# Inputs only: what the counterparties, venues and processor do. Our platform reacts to them.
# Run:  POST /scenarios/demo/run {"mode": "stepped"}   (exactly reproducible)
#       POST /scenarios/demo/run {"mode": "live", "speed": 10}
name: demo
description: >
  09:00 open; PB-ALPHA's API sends 40 locates (34 GC/ETB + 6 Warm); Kestrel's API posts 25 more. In chat,
  traders work borrows and loans: a hot-name RFQ from Kestrel, a PB-ALPHA borrow with a bid, PB-BRAVO's
  borrow list, an internal borrow, a lender's IOIs and a recall; a prompt-injection attempt from Juniper; the
  processor breaks the first booking; background API flow with a 09:00-09:45 burst.
start: "2026-10-27T08:55:00-04:00"
speed: 10
seed: 20261027
end: "10:00:00"
steps:
  - at: "08:55:00"
    do: sfp.flags
    label: First booking of the day comes back with a deliberate break
    args: {force_break_next: true, break_rate: 0.03}

  - at: "08:58:00"
    do: ib.persona
    label: Agent lender morning availability
    args: {persona: harbor-lending, action: ioi, n: 5}

  - at: "09:00:00"
    do: gateway.loadgen
    label: Background API locate flow with the 09:00-09:45 burst
    args: {on: true, base_per_min: 1.5, burst_mult: 6}

  - at: "09:00:05"
    do: gateway.burst
    label: PB-ALPHA's API sends 40 locates (34 ETB + 6 Warm)
    args: {counterparty: PBALPHA, lines: 40, tierCounts: {GC: 34, WARM: 6}, requestId: PBALPHA-DEMO-0001}

  - at: "09:00:30"
    do: gateway.burst
    label: Hedge-fund API posts 25 locates
    args: {counterparty: KESTRELHF, lines: 25, requestId: KESTRELHF-DEMO-0001}

  - at: "09:02:00"
    do: ib.persona
    label: Hot-name RFQ (fair ~450 bps on the venue; client will pay up to 720 bps)
    args: {persona: kestrel-hf, action: rfq, instrument: "@hot:2:US", qty: 500000, maxFeeBps: 720}

  - at: "09:02:30"
    do: ib.persona
    label: PB-ALPHA asks "Any of these?" (META, CRWV, SPCX); it will pay up to 40 bps on each
    args: {persona: pb-alpha, action: any_of_these, instruments: ["META US", "CRWV US", "SPCX US"],
           qtys: [24000, 300000, 24000], maxFeeBps: 40}

  - at: "09:04:30"
    do: ib.say
    label: Our trader quotes two of them ("Maybe these"); PB-ALPHA answers "Send"
    args: {as: srivera, room: pbalpha-desk, text: "Maybe these\nMETA 0.15%\nSPCX 0.3%"}

  - at: "09:05:30"
    do: ib.persona
    label: Harbor offers ASML ("Can you take some ASML? Got 1.5k over here at GC")
    args: {persona: harbor-lending, action: offer, instrument: "ASML NA", qty: 1500, gc: true}

  - at: "09:07:00"
    do: ib.say
    label: Our trader takes part of it
    args: {as: srivera, room: harbor-avails, text: "Sure, send 500"}

  - at: "09:03:00"
    do: ib.persona
    label: PB-BRAVO asks to borrow a SEDOL/ISIN list
    args: {persona: pb-bravo, action: borrow_list, n: 6}

  - at: "09:04:00"
    do: ib.persona
    label: Internal desk asks for an internal borrow
    args: {persona: delta-one, action: internal_borrow, instrument: "@warm:2:US", qty: 2000000}

  - at: "09:05:00"
    do: ib.persona
    label: Second RFQ (London)
    args: {persona: juniper-hf, action: rfq, instrument: "@warm:0:GB", qty: 300000}

  - at: "09:06:00"
    do: ib.persona
    label: Agent lender recalls a loan
    args: {persona: harbor-lending, action: recall}

  - at: "09:06:30"
    do: ib.persona
    label: Safety moment - prompt injection attempt
    args: {persona: juniper-hf, action: injection, instrument: "@hot:1:US", qty: 5000000}

  - at: "09:10:00"
    do: ib.ambient
    label: Background chatter for the rest of the hour
    args: {on: true, everyS: 300}

  - at: "09:45:00"
    do: gateway.loadgen
    label: Burst over; keep a trickle
    args: {on: true, base_per_min: 0.5, burst_mult: 1}
