[project]
name = "loandesk-mock-wematch"
version = "0.1.0"
description = "Venue B (Wematch-style): interest lists, optimiser, negotiation, lifecycle. Synthetic data only."
requires-python = ">=3.13"
dependencies = ["loandesk-mockcore", "loandesk-refdata", "python-multipart>=0.0.9"]

[tool.uv.sources]
loandesk-mockcore = { path = "../libs/mockcore" }
loandesk-refdata = { path = "../libs/refdata" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_wematch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
