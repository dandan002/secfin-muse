[project]
name = "loandesk-mock-ib"
version = "0.1.0"
description = "Desk Chat (Instant Bloomberg-style): rooms, Blast, bot API, scripted/LLM personas. Synthetic data only."
requires-python = ">=3.13"
dependencies = ["loandesk-mockcore", "loandesk-refdata", "openai>=1.40"]

[project.scripts]
mock-ib-corpus = "mock_ib.corpus:main"

[tool.uv.sources]
loandesk-mockcore = { path = "../../libs/mockcore" }
loandesk-refdata = { path = "../../libs/refdata" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_ib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
