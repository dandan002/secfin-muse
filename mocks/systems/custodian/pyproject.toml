[project]
name = "loandesk-mock-custodian"
version = "0.1.0"
description = "Custodian: ISO 20022 sese.023 in, sese.024/025 out. Synthetic data only."
requires-python = ">=3.13"
dependencies = ["loandesk-mockcore", "loandesk-refdata", "lxml>=5"]

[tool.uv.sources]
loandesk-mockcore = { path = "../../libs/mockcore" }
loandesk-refdata = { path = "../../libs/refdata" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_custodian"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
