[project]
name = "loandesk-mock-harness"
version = "0.1.0"
description = "Runs every mock system as its own process and plays the platform against them (smoke + integration tests)."
requires-python = ">=3.13"
# A client of the systems: their connectors (as the platform would use them), plus the simulator SDK
# for seeds and signatures. It imports no system's server code.
dependencies = [
    "httpx>=0.27", "asyncpg>=0.29", "loandesk-mockcore", "loandesk-refdata",
    "loandesk-connector-control", "loandesk-connector-ib", "loandesk-connector-gateway", "loandesk-connector-ngt",
    "loandesk-connector-wematch", "loandesk-connector-sfp", "loandesk-connector-custodian",
]

[tool.uv]
package = false

[tool.uv.sources]
loandesk-mockcore = { path = "../libs/mockcore", editable = true }
loandesk-refdata = { path = "../libs/refdata", editable = true }
loandesk-connector-ngt = { path = "../ngt/connector", editable = true }
loandesk-connector-custodian = { path = "../custodian/connector", editable = true }
loandesk-connector-sfp = { path = "../sfp/connector", editable = true }
loandesk-connector-wematch = { path = "../wematch/connector", editable = true }
loandesk-connector-gateway = { path = "../gateway/connector", editable = true }
loandesk-connector-ib = { path = "../ib/connector", editable = true }
loandesk-connector-control = { path = "../control/connector", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-pyyaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
