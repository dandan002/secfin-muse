[project]
name = "loandesk-connector-ngt"
version = "0.1.0"
description = "Client connector for Venue A (NGT-style): REST/WebSocket API and a FIX 4.4 initiator. Synthetic data only."
requires-python = ">=3.13"
# Standalone: a participant installs this without the venue's code. FIX framing is simplefix, an
# independent implementation, so the connector also checks the venue against the standard.
dependencies = ["httpx>=0.27", "websockets>=13", "pydantic>=2.7", "simplefix>=1.0.17"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ngt_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
files = ["ngt_connector"]
