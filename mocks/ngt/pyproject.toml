[project]
name = "loandesk-mock-ngt"
version = "0.1.0"
description = "Venue A (NGT-style): availability, orders, ledger, FIX 4.4-style session. Synthetic data only."
requires-python = ">=3.13"
dependencies = ["loandesk-mockcore", "loandesk-refdata"]

[tool.uv.sources]
loandesk-mockcore = { path = "../libs/mockcore", editable = true }
loandesk-refdata = { path = "../libs/refdata", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_ngt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
