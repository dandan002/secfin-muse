# House style for every project under mocks/ (ruff finds this from any of them).
line-length = 120
target-version = "py313"

[lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[lint.isort]
known-first-party = ["mockcore", "refdata", "mock_control", "mock_ib", "mock_gateway", "mock_ngt", "mock_wematch",
                     "mock_sfp", "mock_custodian", "mock_analytics", "run_all", "smoke", "conftest"]
