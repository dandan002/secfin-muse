[project]
name = "loandesk-connector-custodian"
version = "0.1.0"
description = "Client connector for the Custodian: ISO 20022 sese.023/020 out, sese.024/025/027 in. Synthetic data only."
requires-python = ">=3.13"
# Standalone: builds and parses ISO 20022 with the standard library, independently of the custodian.
dependencies = ["httpx>=0.27", "websockets>=13"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custodian_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
files = ["custodian_connector"]
